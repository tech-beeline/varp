name: Publish Pre-Release Extension to Marketplace
run-name: ${{ github.actor }} is running pre-release publish 🚀
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Node.js 24.18.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Package pre-release VSIX
        run: npx vsce package --pre-release --no-dependencies

      - name: Publish pre-release to VSCode Marketplace
        env:
          VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
        run: npx vsce publish --pre-release -p "$VSCODE_MARKETPLACE_TOKEN" --packagePath ./*.vsix
