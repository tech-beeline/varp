name: Push
run-name: ${{ github.actor }} is running build on push event 🚀
on:
  push:
    branches:
      - '*'
      - '!main'
      - '!release'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Node.js (latest LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, test and package
        run: npm run build:ci
