name: Publish Extension to Marketplace
run-name: ${{ github.actor }} is running publish 🚀
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Set Node.js 24.18.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: native/graphviz/build-wasm/_deps
          key: emsdk-${{ runner.os }}-${{ hashFiles('native/graphviz/cmake/emsdk.cmake') }}

      - name: Install dependencies
        run: npm ci

      - name: Build, test and package
        run: npm run build:ci

      - name: Publish to VSCode Marketplace
        env:
          VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
        run: npx vsce publish -p "$VSCODE_MARKETPLACE_TOKEN" --packagePath ./*.vsix

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx ovsx publish -p "$OPEN_VSX_TOKEN" ./*.vsix
